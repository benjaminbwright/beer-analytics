; Ofelia job scheduler config (container-native cron). Jobs are defined here
; rather than as labels on the app service, so adding/changing a schedule never
; forces a recreate of the running app container.
;
; Maps cleanly to a k8s CronJob when this graduates off the M5.

; Daily at 04:00 (server-local), off-peak to be polite to maischemalzundmehr.de.
; Frontier-only incremental: --since-max starts just past the highest imported id
; and --stop-after-misses halts once it walks 50 consecutive non-existent ids, so
; a run with no new recipes costs ~50 requests, not a re-scan of the whole archive.
; After importing, it remaps + recalculates metrics + refreshes the ES index.
[job-exec "mmum-incremental"]
schedule = 0 0 4 * * *
container = beer_analytics_app
command = sh -c "python manage.py fetch_mmum --since-max --end 100000 --stop-after-misses 50 --delay 2 && python manage.py map_styles && python manage.py map_hops && python manage.py map_fermentables && python manage.py map_yeasts && python manage.py calculate_metrics && python manage.py calculate_hop_pairings && python manage.py refresh_elasticsearch_data"
